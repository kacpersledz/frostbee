# Frostbee - Flash Partition Layout
#
# nRF52840 Dongle (PCA10059) with MCUboot for Zigbee OTA updates.
#
# Flash map (1 MB):
#   0x000000 - 0x001000  MBR              (  4 KB)  -- managed by hardware
#   0x001000 - 0x011000  MCUboot          ( 64 KB)  -- OTA-capable bootloader
#   0x011000 - 0x081000  Primary slot     (448 KB)  -- running image
#   0x081000 - 0x0f1000  Secondary slot   (448 KB)  -- OTA staging area
#   0x0f1000 - 0x0f9000  ZBOSS NVRAM      ( 32 KB)  -- Zigbee network data
#   0x0f9000 - 0x100000  ZBOSS product cfg( 28 KB)  -- Zigbee product config
#
# Slots are 448 KB each (reclaimed former Nordic UF2 bootloader area).
# UF2 is not used for OTA; all updates go through Zigbee FOTA via MCUboot.
#
# NOTE: nrf5_mbr and mcuboot are static so the only dynamic gap is
# 0x11000-0x81000, forcing mcuboot_primary/app to land in the primary slot.
# mcuboot_primary is NOT defined here — the partition manager creates it
# dynamically as a container spanning mcuboot_pad + app.

nrf5_mbr:
  address: 0x0
  region: flash_primary
  size: 0x1000

mcuboot:
  address: 0x1000
  region: flash_primary
  size: 0x10000

mcuboot_secondary:
  address: 0x81000
  region: flash_primary
  size: 0x70000

zboss_nvram:
  address: 0xf1000
  region: flash_primary
  size: 0x8000
  placement:
    before:
      - zboss_product_config

zboss_product_config:
  address: 0xf9000
  region: flash_primary
  size: 0x7000
  placement:
    before: end
