# Frostbee - Flash Partition Layout
#
# nRF52840 Dongle (PCA10059) with MCUboot for Zigbee OTA updates.
#
# Flash map (1 MB):
#   0x000000 - 0x001000  MBR              (  4 KB)  -- managed by hardware
#   0x001000 - 0x011000  MCUboot          ( 64 KB)  -- OTA-capable bootloader
#   0x011000 - 0x081000  Primary slot     (448 KB)  -- running image
#   0x081000 - 0x0f1000  Secondary slot   (448 KB)  -- OTA staging area
#   0x0f1000 - 0x0f9000  ZBOSS NVRAM      ( 32 KB)  -- Zigbee network data
#   0x0f9000 - 0x0fe000  ZBOSS product cfg( 20 KB)  -- Zigbee product config
#
# Slots are 448 KB each (reclaimed former Nordic UF2 bootloader area).
# UF2 is not used for OTA; all updates go through Zigbee FOTA via MCUboot.
# UICR.NRFFW[0] is not touched -- MBR boots Nordic bootloader which
# then boots MCUboot as the "application". OTA updates stay within the
# secondary slot and never reach the Nordic bootloader area.

mcuboot:
  address: 0x1000
  end_address: 0x11000
  region: flash_primary
  size: 0x10000

mcuboot_primary:
  address: 0x11000
  end_address: 0x81000
  region: flash_primary
  size: 0x70000

mcuboot_secondary:
  address: 0x81000
  end_address: 0xf1000
  region: flash_primary
  size: 0x70000

zboss_nvram:
  address: 0xf1000
  end_address: 0xf9000
  region: flash_primary
  size: 0x8000
  placement:
    before:
      - zboss_product_config

zboss_product_config:
  address: 0xf9000
  end_address: 0xfe000
  region: flash_primary
  size: 0x5000
  placement:
    before: end
