# Frostbee - Flash Partition Layout
#
# nRF52840 Dongle (PCA10059) with MCUboot for Zigbee OTA updates.
#
# Flash map (1 MB):
#   0x000000 - 0x001000  MBR              (  4 KB)  -- managed by hardware
#   0x001000 - 0x011000  MCUboot          ( 64 KB)  -- OTA-capable bootloader
#   0x011000 - 0x072000  Primary slot     (388 KB)  -- running image
#   0x072000 - 0x0d3000  Secondary slot   (388 KB)  -- OTA staging area
#   0x0d3000 - 0x0db000  ZBOSS NVRAM      ( 32 KB)  -- Zigbee network data
#   0x0db000 - 0x0e0000  ZBOSS product cfg( 20 KB)  -- Zigbee product config
#   0x0e0000 - 0x100000  Nordic UF2 bootloader (preserved, 128 KB)
#
# Slots are 388 KB each; current app image is ~350 KB (38 KB headroom).
# UICR.NRFFW[0] is not touched -- MBR boots Nordic bootloader which
# then boots MCUboot as the "application". OTA updates stay within the
# secondary slot and never reach the Nordic bootloader area.

mcuboot:
  address: 0x1000
  end_address: 0x11000
  region: flash_primary
  size: 0x10000

mcuboot_primary:
  address: 0x11000
  end_address: 0x72000
  region: flash_primary
  size: 0x61000

mcuboot_secondary:
  address: 0x72000
  end_address: 0xd3000
  region: flash_primary
  size: 0x61000

zboss_nvram:
  address: 0xd3000
  end_address: 0xdb000
  region: flash_primary
  size: 0x8000
  placement:
    before:
      - zboss_product_config

zboss_product_config:
  address: 0xdb000
  end_address: 0xe0000
  region: flash_primary
  size: 0x5000
  placement:
    before: end
