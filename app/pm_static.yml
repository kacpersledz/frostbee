# Frostbee - Flash Partition Layout
#
# nRF52840 Dongle (PCA10059) with MCUboot for Zigbee OTA updates.
#
# Flash map (1 MB):
#   0x000000 - 0x001000  MBR              (  4 KB)  -- managed by hardware
#   0x001000 - 0x00d000  MCUboot          ( 48 KB)  -- OTA-capable bootloader
#   0x00d000 - 0x080000  Primary slot     (460 KB)  -- running image
#   0x080000 - 0x0f3000  Secondary slot   (460 KB)  -- OTA staging area
#   0x0f3000 - 0x0fb000  ZBOSS NVRAM      ( 32 KB)  -- Zigbee network data
#   0x0fb000 - 0x0ff000  ZBOSS product cfg( 16 KB)  -- Zigbee product config
#   0x0ff000 - 0x100000  (unused)         (  4 KB)
#
# Slot sizing rationale:
#   Current firmware binary: ~342 KB (from 685 KB UF2 file, each block = 256 B data)
#   zigbee_fota + img_manager add ~50 KB -> ~392 KB total
#   460 KB slots give ~68 KB headroom for future growth.
#
# NOTE: ZBOSS NVRAM moves from 0xcc000 to 0xf3000 vs. the old UF2-bootloader layout.
# The device will need to re-join the Zigbee network after the first flash.
#
# IMPORTANT - UF2 drag-and-drop after first MCUboot install:
#   Switching to MCUboot updates UICR.NRFFW[0] to point to MCUboot (0x1000).
#   The factory UF2 bootloader at 0xd8000 is still in flash but no longer
#   invoked on double-tap reset. Future updates go via Zigbee OTA only.
#   Emergency recovery: use a J-Link programmer or enable MCUboot USB-serial DFU
#   (CONFIG_MCUBOOT_SERIAL=y in child_image/mcuboot.conf).
#
# Initial installation (one-time, from factory firmware):
#   Double-tap reset to enter factory UF2 bootloader, then:
#     nrfutil dfu usb-serial -pkg build/dfu_mcuboot.zip -p /dev/ttyACM0
#   OR drag merged.uf2 via the factory USB mass-storage interface.
#   After this, all updates are via Zigbee OTA (Z2M / ZHA).

mcuboot:
  address: 0x1000
  end_address: 0xd000
  region: flash_primary
  size: 0xc000

mcuboot_primary:
  address: 0xd000
  end_address: 0x80000
  region: flash_primary
  size: 0x73000

mcuboot_secondary:
  address: 0x80000
  end_address: 0xf3000
  region: flash_primary
  size: 0x73000

zboss_nvram:
  address: 0xf3000
  end_address: 0xfb000
  region: flash_primary
  size: 0x8000
  placement:
    before:
      - zboss_product_config

zboss_product_config:
  address: 0xfb000
  end_address: 0xff000
  region: flash_primary
  size: 0x4000
  placement:
    before: end
