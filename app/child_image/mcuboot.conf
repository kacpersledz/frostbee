# MCUboot child image configuration for Frostbee
#
# MCUboot is the system bootloader that enables Zigbee OTA updates.
# It manages the dual-slot flash layout (primary + secondary) and
# performs image swap when a validated OTA image is available.

# Erase flash pages progressively during image copy rather than all at once.
# Reduces the window of data loss if power fails mid-update.
CONFIG_BOOT_ERASE_PROGRESSIVELY=y
