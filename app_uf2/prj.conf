# Frostbee UF2 Battlefield App
# Goal: stable sensor/config/button behavior with USB logs + incremental Zigbee SED hardening.
#
# Build:
#   west build -b nrf52840dongle/nrf52840 app_uf2 --build-dir app_uf2/build
#
# NOTE:
# This app is meant for the restored Adafruit UF2 bootloader flow.
# 0x26000 is the common nRF52 UF2 application start address.
# If your bootloader uses a different app address, adjust this offset.

# Core drivers
CONFIG_I2C=y
CONFIG_PINCTRL=y
CONFIG_SENSOR=y
CONFIG_GPIO=y
CONFIG_ADC=y

# Logging / console over USB CDC ACM
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_KERNEL_LOG_LEVEL_WRN=y
CONFIG_USB_DRIVER_LOG_LEVEL_ERR=y
CONFIG_NRF_USBD_COMMON_LOG_LEVEL_ERR=y
CONFIG_USBC_LOG_LEVEL_ERR=y

# Keep stack conservative for heavy logging, Zigbee, and sensor work
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Zigbee SED core (Phase 2A, no OTA)
CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_END_DEVICE=y
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y

# Keep IPv6/UDP stack disabled, Zigbee only
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=n

# Explicit no-OTA profile in UF2 battlefield app
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_ZIGBEE_FOTA=n

# UF2-bootloader application region (common Adafruit nRF52 layout)
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_FLASH_LOAD_OFFSET=0x26000
