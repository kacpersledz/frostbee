name: Release

# Triggered by version tags: git tag v1.2.3 && git push origin v1.2.3
#
# Builds firmware with the proper semver, creates a Zigbee OTA file, and
# publishes a GitHub Release with both attached.
#
# ── One-time setup ──────────────────────────────────────────────────────────
# 1. Generate a signing key (keep the .pem secret, never commit it):
#      python3 $ZEPHYR_BASE/../bootloader/mcuboot/scripts/imgtool.py \
#        keygen -k frostbee_signing.pem -t ecdsa-p256
#
# 2. Add the private key to GitHub Secrets:
#      Settings → Secrets → Actions → New repository secret
#      Name:  MCUBOOT_SIGNING_KEY
#      Value: (paste the full contents of frostbee_signing.pem)
#
# 3. Set CONFIG_ZIGBEE_FOTA_MANUFACTURER_ID and CONFIG_ZIGBEE_FOTA_IMAGE_TYPE
#    in app/prj.conf to values that match your Z2M external converter.
#
# ── Z2M fully-automatic OTA ──────────────────────────────────────────────────
# Add to your Zigbee2MQTT configuration.yaml (one-time):
#
#   ota:
#     zigbee_ota_override_index_location: https://raw.githubusercontent.com/winterberryice/frostbee/master/ota_index.json
#     update_check_interval: 1440   # check daily (minutes); 0 = only on Z2M restart
#
# After that: push a version tag → GitHub Release is created with frostbee.zigbee
# → Z2M downloads it on the next check → offers OTA to matching devices.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v2.9.2

    strategy:
      matrix:
        variant:
          - name: sht40
            overlay: boards/sht40.overlay
            model: FBE_TH_1
            image_type: 1
          - name: bme280
            overlay: boards/bme280.overlay
            model: FBE_TH_2
            image_type: 2

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: app
          fetch-depth: 0

      - name: Cache west modules
        id: cache-west
        uses: actions/cache@v4
        with:
          path: sdk
          key: west-modules-ncs-zigbee-v1.2.1

      - name: Initialise west workspace (ncs-zigbee v1.2.1 / NCS v2.9.2)
        if: steps.cache-west.outputs.cache-hit != 'true'
        run: |
          west init sdk -m https://github.com/nrfconnect/ncs-zigbee --mr v1.2.1
          cd sdk && west update --narrow -o=--depth=1

      - name: Write VERSION file
        run: |
          RAW_VER="${GITHUB_REF_NAME#v}"

          if [[ "$RAW_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Valid version detected: $RAW_VER"
            MAJOR=$(echo "$RAW_VER" | cut -d. -f1)
            MINOR=$(echo "$RAW_VER" | cut -d. -f2)
            PATCH=$(echo "$RAW_VER" | cut -d. -f3)
          else
            echo "Ref '$RAW_VER' is not a version. Using 0.0.0."
            MAJOR=0; MINOR=0; PATCH=0
          fi

          printf 'VERSION_MAJOR = %d\nVERSION_MINOR = %d\nPATCHLEVEL = %d\nVERSION_TWEAK = 0\n' \
            "${MAJOR:-0}" "${MINOR:-0}" "${PATCH:-0}" > app/app/VERSION
          
          echo "--- app/app/VERSION content ---"
          cat app/app/VERSION

      - name: Build firmware
        env:
          SIGNING_KEY: ${{ secrets.MCUBOOT_SIGNING_KEY }}
        run: |
          REPO_ROOT=$(pwd)/app

          OVERLAY_PATH="$REPO_ROOT/app/${{ matrix.variant.overlay }}"
          echo "Looking for overlay at: $OVERLAY_PATH"

          ARGS=("-DDTC_OVERLAY_FILE=$OVERLAY_PATH")
          ARGS+=("-DCONFIG_ZIGBEE_FOTA_IMAGE_TYPE=${{ matrix.variant.image_type }}")
          ARGS+=("-DCONFIG_FROSTBEE_MODEL_ID=\"${{ matrix.variant.model }}\"")
          
          if [[ -n "$SIGNING_KEY" ]]; then
            mkdir -p "$REPO_ROOT/app/keys"
            printf '%s' "$SIGNING_KEY" > "$REPO_ROOT/app/keys/signing.pem"
            ARGS+=("-DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\"$REPO_ROOT/app/keys/signing.pem\"")
          fi
          
          cd sdk && west build \
            -p always \
            -b nrf52840dongle/nrf52840 \
            ../app/app \
            --build-dir ../build-${{ matrix.variant.name }} \
            -- "${ARGS[@]}"

      - name: Prepare Artifacts
        run: |
          # Merge MBR
          python3 sdk/zephyr/scripts/build/mergehex.py --overlap=replace \
            build-${{ matrix.variant.name }}/merged.hex \
            app/app/nice_nano_mbr.hex \
            -o build-${{ matrix.variant.name }}/frostbee_${{ matrix.variant.name }}_complete.hex
          
          # Rename Zigbee file to include variant and tag
          cp build-${{ matrix.variant.name }}/*.zigbee frostbee-${{ matrix.variant.name }}-${{ github.ref_name }}.zigbee

      - name: Upload temporary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files-${{ matrix.variant.name }}
          path: |
            build-${{ matrix.variant.name }}/frostbee_${{ matrix.variant.name }}_complete.hex
            frostbee-${{ matrix.variant.name }}-${{ github.ref_name }}.zigbee

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master # We need master to update the index

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-files-*
          merge-multiple: true

      - name: Update OTA index
        run: |
          # Extract file versions from the .zigbee filenames
          # Zigbee filenames are: mfr-type-version-comment.zigbee
          
          SHT_FILE=$(ls frostbee-sht40-*.zigbee)
          SHT_VER_DEC=$((16#$(echo "$SHT_FILE" | cut -d'-' -f4)))
          
          BME_FILE=$(ls frostbee-bme280-*.zigbee)
          BME_VER_DEC=$((16#$(echo "$BME_FILE" | cut -d'-' -f4)))
          
          printf '[\n  {\n    "url": "https://github.com/winterberryice/frostbee/releases/latest/download/%s",\n    "manufacturerCode": 4660,\n    "imageType": 1,\n    "fileVersion": %s\n  },\n  {\n    "url": "https://github.com/winterberryice/frostbee/releases/latest/download/%s",\n    "manufacturerCode": 4660,\n    "imageType": 2,\n    "fileVersion": %s\n  }\n]\n' \
            "$SHT_FILE" "$SHT_VER_DEC" "$BME_FILE" "$BME_VER_DEC" > ota_index.json
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ota_index.json
          git commit -m "chore: update OTA index for ${GITHUB_REF_NAME}" || echo "No changes"
          git push origin master

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.hex
            *.zigbee
          generate_release_notes: true