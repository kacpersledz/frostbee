name: Build Artifacts

# Manual trigger: Actions → Build Artifacts → Run workflow
#
# Builds the firmware and uploads all artifacts (merged.hex, .zigbee OTA,
# .uf2) so you can verify paths and test the full build pipeline without
# creating a release.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v2.9.2
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: app

      - name: Cache west modules
        id: cache-west
        uses: actions/cache@v4
        with:
          path: sdk
          key: west-modules-ncs-zigbee-v1.2.1

      - name: Initialise west workspace (ncs-zigbee v1.2.1 / NCS v2.9.2)
        if: steps.cache-west.outputs.cache-hit != 'true'
        run: |
          west init sdk -m https://github.com/nrfconnect/ncs-zigbee --mr v1.2.1
          cd sdk && west update --narrow -o=--depth=1

      - name: Compute version
        id: ver
        run: |
          SHORT="${GITHUB_SHA::8}"
          IMG_VER="0.0.0+0"
          FILE_VER="0x00000000"
          ARTIFACT="frostbee-dev-${SHORT}.zigbee"
          UF2_ARTIFACT="frostbee-dev-${SHORT}.uf2"
          echo "img_ver=$IMG_VER"           >> "$GITHUB_OUTPUT"
          echo "file_ver=$FILE_VER"         >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT"         >> "$GITHUB_OUTPUT"
          echo "uf2_artifact=$UF2_ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "Version: img=$IMG_VER  file=$FILE_VER  sha=$SHORT"

      - name: Write signing key
        env:
          MCUBOOT_SIGNING_KEY: ${{ secrets.MCUBOOT_SIGNING_KEY }}
        run: |
          if [[ -n "$MCUBOOT_SIGNING_KEY" ]]; then
            mkdir -p app/app/keys
            printf '%s' "$MCUBOOT_SIGNING_KEY" > app/app/keys/signing.pem
          fi

      - name: Build firmware
        env:
          SIGNING_KEY: ${{ secrets.MCUBOOT_SIGNING_KEY }}
          IMG_VER: ${{ steps.ver.outputs.img_ver }}
        run: |
          ARGS=(-Dapp_CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="\"$IMG_VER\"")
          if [[ -n "$SIGNING_KEY" ]]; then
            ARGS+=(-Dmcuboot_CONFIG_BOOT_SIGNATURE_KEY_FILE="\"$(pwd)/app/app/keys/signing.pem\"")
          fi
          cd sdk && west build \
            -b nrf52840dongle/nrf52840 \
            ../app/app \
            --build-dir ../build \
            -- "${ARGS[@]}"

      - name: List build tree (UF2 diagnostic)
        run: |
          echo "--- all *.uf2 files ---"
          find build/ -name "*.uf2" | sort
          echo "--- all *.hex files ---"
          find build/ -name "*.hex" | sort
          echo "-----------------------"

      - name: Create Zigbee OTA file
        env:
          ARTIFACT: ${{ steps.ver.outputs.artifact }}
          UF2_ARTIFACT: ${{ steps.ver.outputs.uf2_artifact }}
          FILE_VER: ${{ steps.ver.outputs.file_ver }}
        run: |
          bash app/scripts/create_ota.sh \
            --input       build/app/zephyr/zephyr.signed.bin \
            --output      "$ARTIFACT" \
            --manufacturer-id 0x1234 \
            --image-type      0x0001 \
            --file-version    "$FILE_VER"
          cp build/zephyr/zephyr.uf2 "$UF2_ARTIFACT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frostbee-dev-${{ github.sha }}
          path: |
            ${{ steps.ver.outputs.artifact }}
            ${{ steps.ver.outputs.uf2_artifact }}
            build/merged.hex
          if-no-files-found: error
