name: Build Artifacts

# Temporary: runs on every push to verify UF2 paths before merging
# into the release workflow. Will be removed afterwards.

on:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v2.9.2
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: app

      - name: Cache west modules
        id: cache-west
        uses: actions/cache@v4
        with:
          path: sdk
          key: west-modules-ncs-zigbee-v1.2.1

      - name: Initialise west workspace (ncs-zigbee v1.2.1 / NCS v2.9.2)
        if: steps.cache-west.outputs.cache-hit != 'true'
        run: |
          west init sdk -m https://github.com/nrfconnect/ncs-zigbee --mr v1.2.1
          cd sdk && west update --narrow -o=--depth=1

      - name: Compute version
        id: ver
        run: |
          SHORT="${GITHUB_SHA::8}"
          IMG_VER="0.0.0+0"
          FILE_VER="0x00000000"
          ARTIFACT="frostbee-dev-${SHORT}.zigbee"
          UF2_ARTIFACT="frostbee-dev-${SHORT}.uf2"
          echo "img_ver=$IMG_VER"           >> "$GITHUB_OUTPUT"
          echo "file_ver=$FILE_VER"         >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT"         >> "$GITHUB_OUTPUT"
          echo "uf2_artifact=$UF2_ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "Version: img=$IMG_VER  file=$FILE_VER  sha=$SHORT"

      - name: Write signing key
        env:
          MCUBOOT_SIGNING_KEY: ${{ secrets.MCUBOOT_SIGNING_KEY }}
        run: |
          if [[ -n "$MCUBOOT_SIGNING_KEY" ]]; then
            mkdir -p app/app/keys
            printf '%s' "$MCUBOOT_SIGNING_KEY" > app/app/keys/signing.pem
          fi

      - name: Build firmware
        env:
          SIGNING_KEY: ${{ secrets.MCUBOOT_SIGNING_KEY }}
          IMG_VER: ${{ steps.ver.outputs.img_ver }}
        run: |
          ARGS=(-Dapp_CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="\"$IMG_VER\"")
          if [[ -n "$SIGNING_KEY" ]]; then
            ARGS+=(-Dmcuboot_CONFIG_BOOT_SIGNATURE_KEY_FILE="\"$(pwd)/app/app/keys/signing.pem\"")
          fi
          cd sdk && west build \
            -b nrf52840dongle/nrf52840 \
            ../app/app \
            --build-dir ../build \
            -- "${ARGS[@]}"

      - name: List build tree (UF2 diagnostic)
        run: |
          echo "--- all *.uf2 files ---"
          find build/ -name "*.uf2" | sort
          echo "--- all *.hex files ---"
          find build/ -name "*.hex" | sort
          echo "-----------------------"

      - name: Inspect UICR in merged.hex
        run: |
          python3 - <<'EOF'
          # nRF52840 UICR base: 0x10001000
          # NRFFW[0] at offset 0x14 => 0x10001014  (points to bootloader)
          # NRFFW[1] at offset 0x18 => 0x10001018  (MBR params)
          UICR_BASE   = 0x10001000
          NRFFW0_ADDR = 0x10001014

          flash = {}
          with open("build/merged.hex") as f:
              ext = 0
              for line in f:
                  line = line.strip()
                  if not line.startswith(":"):
                      continue
                  byte_count  = int(line[1:3],   16)
                  address     = int(line[3:7],   16) + ext
                  record_type = int(line[7:9],   16)
                  if record_type == 4:          # Extended Linear Address
                      ext = int(line[9:13], 16) << 16
                  elif record_type == 0:        # Data
                      for i in range(byte_count):
                          flash[address + i] = int(line[9 + i*2 : 11 + i*2], 16)

          uicr_bytes = [a for a in flash if UICR_BASE <= a < UICR_BASE + 0x1000]
          if not uicr_bytes:
              print("UICR: NOT present in merged.hex")
              print("  => UICR.NRFFW[0] unchanged after flash (still points to Nordic UF2 bootloader at 0xE0000)")
          else:
              print(f"UICR: present ({len(uicr_bytes)} bytes written)")
              if NRFFW0_ADDR in flash:
                  val = sum(flash.get(NRFFW0_ADDR + i, 0xFF) << (8*i) for i in range(4))
                  print(f"  UICR.NRFFW[0] = 0x{val:08X}", end="  ")
                  if val == 0xFFFFFFFF:
                      print("(erased/not set)")
                  elif val == 0x0E0000:
                      print("=> Nordic UF2 bootloader (RISK: OTA will brick device)")
                  elif val == 0x001000:
                      print("=> MCUboot (safe: OTA will NOT brick device)")
                  else:
                      print(f"=> unknown target")
              else:
                  print("  UICR.NRFFW[0] = not written (0xFF default)")
          EOF

      - name: Create Zigbee OTA file
        env:
          ARTIFACT: ${{ steps.ver.outputs.artifact }}
          UF2_ARTIFACT: ${{ steps.ver.outputs.uf2_artifact }}
          FILE_VER: ${{ steps.ver.outputs.file_ver }}
        run: |
          bash app/scripts/create_ota.sh \
            --input       build/app/zephyr/zephyr.signed.bin \
            --output      "$ARTIFACT" \
            --manufacturer-id 0x1234 \
            --image-type      0x0001 \
            --file-version    "$FILE_VER"
          cp build/app/zephyr/zephyr.uf2 "$UF2_ARTIFACT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frostbee-dev-${{ github.sha }}
          path: |
            ${{ steps.ver.outputs.artifact }}
            ${{ steps.ver.outputs.uf2_artifact }}
            build/merged.hex
          if-no-files-found: error
