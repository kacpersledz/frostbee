name: Build

# Build on every branch push and produce dev artifacts.
#
# Version scheme for dev builds:
#   image_version="0.0.0+0"  file_version=0x00000000
#   Dev builds are never OTA candidates; the artifact is for flashing directly.
#
# For release builds triggered by version tags see release.yml.

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v2.9.2

    strategy:
      matrix:
        variant:
          - name: sht40
            overlay: boards/sht40.overlay
            model: FBE_TH_1
            image_type: 1
          - name: bme280
            overlay: boards/bme280.overlay
            model: FBE_TH_2
            image_type: 2

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: app

      - name: Cache west modules
        id: cache-west
        uses: actions/cache@v4
        with:
          path: sdk
          key: west-modules-ncs-zigbee-v1.2.1

      - name: Initialise west workspace (ncs-zigbee v1.2.1 / NCS v2.9.2)
        if: steps.cache-west.outputs.cache-hit != 'true'
        run: |
          west init sdk -m https://github.com/nrfconnect/ncs-zigbee --mr v1.2.1
          cd sdk && west update --narrow -o=--depth=1

      - name: Compute version
        id: ver
        run: |
          SHORT="${GITHUB_SHA::8}"
          ARTIFACT="frostbee-${{ matrix.variant.name }}-dev-${SHORT}.zigbee"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "Version: dev sha=$SHORT"

      - name: Write VERSION file
        run: |
          printf 'VERSION_MAJOR = 0\nVERSION_MINOR = 0\nPATCHLEVEL = 0\nVERSION_TWEAK = 0\n' \
            > app/app/VERSION
          echo "--- app/app/VERSION ---"
          cat app/app/VERSION

      # If MCUBOOT_SIGNING_KEY secret is set, use it; otherwise the NCS
      # default development key is used (fine for testing, not for production).
      - name: Write signing key
        env:
          MCUBOOT_SIGNING_KEY: ${{ secrets.MCUBOOT_SIGNING_KEY }}
        run: |
          if [[ -n "$MCUBOOT_SIGNING_KEY" ]]; then
            mkdir -p app/app/keys
            printf '%s' "$MCUBOOT_SIGNING_KEY" > app/app/keys/signing.pem
          fi

      - name: Build firmware
        env:
          SIGNING_KEY: ${{ secrets.MCUBOOT_SIGNING_KEY }}
        run: |
          # 1. Initialize arguments array with matrix-specific values
          ARGS=("-DDTC_OVERLAY_FILE=${{ matrix.variant.overlay }}")
          ARGS+=("-DCONFIG_ZIGBEE_FOTA_IMAGE_TYPE=${{ matrix.variant.image_type }}")
          ARGS+=("-DCONFIG_FROSTBEE_MODEL_ID=\"${{ matrix.variant.model }}\"")
          
          # 2. Add the signing key only if the secret is available
          if [[ -n "$SIGNING_KEY" ]]; then
            # $(pwd) ensures the absolute path is passed to CMake/MCUboot
            ARGS+=("-Dmcuboot_CONFIG_BOOT_SIGNATURE_KEY_FILE=\"$(pwd)/app/app/keys/signing.pem\"")
          fi
          
          # 3. Run the build using the variable build directory
          cd sdk && west build \
            -p always \
            -b nrf52840dongle/nrf52840 \
            ../app/app \
            --build-dir ../build-${{ matrix.variant.name }} \
            -- "${ARGS[@]}"

      - name: Merge MBR into merged.hex
        run: |
          python3 sdk/zephyr/scripts/build/mergehex.py \
            --overlap=replace \
            build-${{ matrix.variant.name }}/merged.hex \
            app/app/nice_nano_mbr.hex \
            -o build-${{ matrix.variant.name }}/frostbee_complete.hex

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frostbee-${{ matrix.variant.name }}-${{ github.sha }}
          path: |
            build-${{ matrix.variant.name }}/frostbee_complete.hex
            build-${{ matrix.variant.name }}/*.zigbee
          if-no-files-found: warn
