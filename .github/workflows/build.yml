name: Build & Release

# Build on every push.
# On version tags (v*.*.*) also:
#   - sign with the production key (MCUBOOT_SIGNING_KEY secret)
#   - create a Zigbee OTA file (.zigbee)
#   - publish a GitHub Release with the OTA file attached
#
# ── One-time setup ──────────────────────────────────────────────────────────
# 1. Generate a signing key (keep the .pem secret, never commit it):
#      python3 $ZEPHYR_BASE/../bootloader/mcuboot/scripts/imgtool.py \
#        keygen -k frostbee_signing.pem -t ecdsa-p256
#
# 2. Add the private key to GitHub Secrets:
#      Settings → Secrets → Actions → New repository secret
#      Name:  MCUBOOT_SIGNING_KEY
#      Value: (paste the full contents of frostbee_signing.pem)
#
# 3. Set CONFIG_ZIGBEE_FOTA_MANUFACTURER_ID and CONFIG_ZIGBEE_FOTA_IMAGE_TYPE
#    in app/prj.conf to values that match your Z2M external converter.
#
# ── Release workflow ─────────────────────────────────────────────────────────
# Push a version tag to trigger a release:
#   git tag v1.2.3 && git push origin v1.2.3
#
# ── Z2M fully-automatic OTA ──────────────────────────────────────────────────
# Add to your Zigbee2MQTT configuration.yaml (one-time):
#
#   ota:
#     index_override: https://raw.githubusercontent.com/winterberryice/frostbee/main/ota_index.json
#     update_check_interval: 1440   # check daily (minutes); 0 = only on Z2M restart
#
# After that: push a version tag → GitHub Release is created with frostbee.zigbee
# → Z2M downloads it on the next check → offers OTA to matching devices.
# No manual file copying needed.

on:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v2.9.2
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: app
          fetch-depth: 0   # needed for git describe / tag parsing

      - name: Cache west modules
        id: cache-west
        uses: actions/cache@v4
        with:
          path: sdk
          key: west-modules-ncs-zigbee-v1.2.1

      - name: Initialise west workspace (ncs-zigbee v1.2.1 / NCS v2.9.2)
        if: steps.cache-west.outputs.cache-hit != 'true'
        run: |
          west init sdk -m https://github.com/nrfconnect/ncs-zigbee --mr v1.2.1
          cd sdk && west update --narrow -o=--depth=1

      # ── Version ────────────────────────────────────────────────────────────
      # v1.2.3  →  image_version="1.2.3+0"  file_version=0x01020300
      # non-tag →  image_version="0.0.N+0"  file_version=0x000000NN  (N=commit count)
      - name: Compute version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"          # e.g. v1.2.3
            IFS='.' read -r MAJOR MINOR PATCH <<< "${TAG#v}"
            IMG_VER="${MAJOR}.${MINOR}.${PATCH}+0"
            FILE_VER=$(printf "0x%02x%02x%02x00" "$MAJOR" "$MINOR" "$PATCH")
            ARTIFACT="frostbee-${TAG}.zigbee"
            IS_RELEASE=true
          else
            N=$(git -C app rev-list --count HEAD)
            IMG_VER="0.0.${N}+0"
            FILE_VER=$(printf "0x%08x" "$N")
            ARTIFACT="frostbee-dev-${GITHUB_SHA::8}.zigbee"
            IS_RELEASE=false
          fi
          echo "img_ver=$IMG_VER"     >> "$GITHUB_OUTPUT"
          echo "file_ver=$FILE_VER"   >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT"   >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Version: img=$IMG_VER  file=$FILE_VER  release=$IS_RELEASE"

      # ── Signing key ────────────────────────────────────────────────────────
      # If MCUBOOT_SIGNING_KEY secret is set, use it; otherwise the NCS
      # default development key is used (fine for testing, not for production).
      - name: Write signing key
        if: ${{ env.MCUBOOT_SIGNING_KEY != '' }}
        env:
          MCUBOOT_SIGNING_KEY: ${{ secrets.MCUBOOT_SIGNING_KEY }}
        run: |
          mkdir -p app/app/keys
          printf '%s' "$MCUBOOT_SIGNING_KEY" > app/app/keys/signing.pem

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build firmware
        env:
          SIGNING_KEY: ${{ secrets.MCUBOOT_SIGNING_KEY }}
        run: |
          EXTRA_ARGS="-DCONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION=\"${{ steps.ver.outputs.img_ver }}\""

          if [[ -n "$SIGNING_KEY" ]]; then
            KEY_PATH="$(pwd)/app/app/keys/signing.pem"
            EXTRA_ARGS="$EXTRA_ARGS -Dmcuboot_CONFIG_BOOT_SIGNATURE_KEY_FILE=\"$KEY_PATH\""
          fi

          cd sdk && eval west build \
            -b nrf52840dongle/nrf52840 \
            ../app/app \
            --build-dir ../build \
            -- $EXTRA_ARGS

      # ── Create Zigbee OTA file ─────────────────────────────────────────────
      # Two outputs:
      #   frostbee-vX.Y.Z.zigbee  – versioned, for reference / manual use
      #   frostbee.zigbee          – fixed name; GitHub /releases/latest/download/
      #                              always serves this → ota_index.json never changes
      - name: Create Zigbee OTA file
        run: |
          python3 app/scripts/create_ota.py \
            --input       build/app/zephyr/zephyr.signed.bin \
            --output      "${{ steps.ver.outputs.artifact }}" \
            --manufacturer-id 0x1234 \
            --image-type      0x0001 \
            --file-version    "${{ steps.ver.outputs.file_ver }}"
          cp "${{ steps.ver.outputs.artifact }}" frostbee.zigbee

      # ── Upload artifacts ───────────────────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frostbee-${{ github.sha }}
          path: |
            ${{ steps.ver.outputs.artifact }}
            build/merged.hex
          if-no-files-found: error

      # ── GitHub Release (version tags only) ────────────────────────────────
      - name: Create GitHub Release
        if: steps.ver.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.ver.outputs.artifact }}
            frostbee.zigbee
          generate_release_notes: true
          body: |
            ## Zigbee OTA — automatic update

            Z2M will pick this up automatically if configured with:
            ```yaml
            ota:
              index_override: https://raw.githubusercontent.com/winterberryice/frostbee/main/ota_index.json
              update_check_interval: 1440
            ```

            **MCUboot image version:** `${{ steps.ver.outputs.img_ver }}`
            **Zigbee OTA file version:** `${{ steps.ver.outputs.file_ver }}`
